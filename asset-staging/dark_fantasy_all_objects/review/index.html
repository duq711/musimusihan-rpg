<script>
const data=JSON.parse(document.querySelector('#data').textContent),$=s=>document.querySelector(s);
let mode='objects',active=data.objects[0]?.id,view='sheet';
const labels={sheet:'6방향 전체',front:'정면',back:'후면',left:'왼쪽',right:'오른쪽',top:'위',bottom:'아래'};
const categories={character:'캐릭터',equipment:'장비',prop:'소품',hideout_prop:'은신처 소품',architecture:'건축물',effect:'시각 효과',mine_prop:'폐광 소품',mine_geometry:'폐광 지형',camp:'야영 도구',environment:'환경',vfx:'시각 효과',test_fixture:'시험 도구'};
$('#counts').innerHTML=`전체 <strong>${data.counts.total}</strong>종 · 컨셉 <strong>${data.counts.concept}</strong>종<br>변경 전 <strong>${data.counts.baseline}</strong>종 · 현재 촬영 <strong>${data.counts.current}</strong>종`;
function filtered(){const q=$('#search').value.trim().toLocaleLowerCase();return data[mode].filter(x=>(x.title+' '+x.id).toLocaleLowerCase().includes(q));}
function renderList(){const list=$('#list');list.replaceChildren();for(const entry of filtered()){const button=document.createElement('button');button.setAttribute('aria-pressed',String(entry.id===active));const label=document.createElement('span');label.textContent=entry.title;button.append(label);if(mode==='objects'){const small=document.createElement('small');small.textContent=entry.current?'촬영됨':'촬영 대기';button.append(small);}button.onclick=()=>{active=entry.id;render();};list.append(button);}if(!list.children.length){const empty=document.createElement('span');empty.className='empty-list';empty.textContent='일치하는 항목이 없습니다.';list.append(empty);}}
function panel(title,subtitle,url,record,missing){const wrap=document.createElement('section');wrap.className='panel';const heading=document.createElement('h3');heading.append(document.createTextNode(title));const sub=document.createElement('span');sub.textContent=subtitle;heading.append(sub);wrap.append(heading);const visual=document.createElement(url?'button':'div');visual.className='visual'+(url?'':' empty');if(url){visual.setAttribute('aria-label',title+' 확대');const img=document.createElement('img');img.src=url;img.alt=$('#title').textContent+' · '+title;visual.append(img);visual.onclick=()=>{$('#largeImage').src=url;$('#largeImage').alt=img.alt;$('#imageTitle').textContent=img.alt;$('#lightbox').showModal();};}else visual.textContent=missing;wrap.append(visual);const footer=document.createElement('footer');if(record){const a=document.createElement('a');a.href=record.manifest;a.textContent='촬영 기록';a.target='_blank';footer.append(a,document.createTextNode(' · '+record.iteration));}else footer.textContent=url?'이미지 생성 원본':'대체 이미지를 넣지 않았습니다.';wrap.append(footer);return wrap;}
function render(){renderList();const entry=data[mode].find(x=>x.id===active);if(!entry)return;$('#title').textContent=entry.title;$('#meta').textContent=mode==='objects'?`${categories[entry.category]||entry.category} · ${entry.id}`:'같은 위치 · 같은 시야각 · 실제 장소의 조명';$('#status').textContent=mode==='objects'?(entry.current?'현재 모델 촬영 완료':'현재 모델 촬영 대기'):(entry.current?'변경 전후 촬영 완료':'현재 장소 촬영 대기');$('#directions').replaceChildren();if(mode==='objects')for(const [key,label] of Object.entries(labels)){const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed',String(view===key));b.onclick=()=>{view=key;render();};$('#directions').append(b);}const panels=$('#panels');panels.className='panels'+(mode==='scenes'?' scenes':'');panels.replaceChildren();if(mode==='objects')panels.append(panel('생성 컨셉','6방향 원본',entry.concept,null,'컨셉 생성 대기'));for(const [key,title] of [['baseline','변경 전 모델'],['current','현재 모델']]){const r=entry[key],url=r?(mode==='scenes'||view==='sheet'?r.sheet:r.views[view]):null;panels.append(panel(mode==='scenes'?title.replace('모델','장소'):title,mode==='scenes'?'실제 게임 렌더':labels[view],url,r,'실제 촬영 대기'));}$('#note').textContent=mode==='objects'?'실제 모델 비교판 순서: 첫 줄 정면 · 후면 · 왼쪽, 둘째 줄 오른쪽 · 위 · 아래. 정면은 게임의 −Z 축입니다. 컨셉은 생성 원본을 그대로 표시하며, 모델은 동일한 도감 조명으로 촬영했습니다. 완성된 플레이어 몸·손·팔은 요청에 따라 제외했습니다. 촬영 완료는 형태의 일치 판정과 별개입니다.':'은신처·성물실·폐광의 실제 공간과 소품을 촬영했습니다. 몸과 손은 숨기고 실제 횃불의 전방 조명·주변 보조광을 유지했습니다. 원정 상태와 커서를 보존했으며 별도 게임 창이나 외부 입력 없이 촬영했습니다.';}
function selectMode(nextMode){mode=nextMode;active=data[mode][0]?.id;$('#search').value='';$('#objectsTab').setAttribute('aria-pressed',String(mode==='objects'));$('#scenesTab').setAttribute('aria-pressed',String(mode==='scenes'));render();}
$('#objectsTab').onclick=()=>selectMode('objects');$('#scenesTab').onclick=()=>selectMode('scenes');$('#search').oninput=renderList;for(const [id,delta]of[['previous',-1],['next',1]])$('#'+id).onclick=()=>{const items=filtered();if(!items.length)return;const index=items.findIndex(x=>x.id===active);active=items[index<0?(delta<0?items.length-1:0):(index+delta+items.length)%items.length].id;render();};$('#close').onclick=()=>$('#lightbox').close();$('#lightbox').onclick=e=>{if(e.target===$('#lightbox'))$('#lightbox').close();};render();
</script>
