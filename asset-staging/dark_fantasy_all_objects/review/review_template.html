<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>어둠의 오브젝트 · 아트 비교</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;color:#e3e6df;background:#111715;font-size:14px}
*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button,a{touch-action:manipulation}button{color:inherit;background:#202923;border:1px solid #3c4940;border-radius:6px;padding:9px 13px;cursor:pointer}button:hover{border-color:#98a58d}button[aria-pressed=true]{background:#c3ceb4;color:#152015;border-color:#c3ceb4}a{color:#bbcfa8;text-underline-offset:4px}header{padding:26px 32px 22px;border-bottom:1px solid #303a32;display:flex;justify-content:space-between;gap:24px;align-items:center}h1{font-size:24px;font-weight:550;margin:0 0 8px;letter-spacing:-.7px}header p{margin:0;color:#a4afa3;font-size:13px;line-height:1.7}.counter{font-size:13px;white-space:nowrap;line-height:1.9;color:#aebcab}.counter strong{color:#e1e9db;font-weight:600}.shell{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 138px)}aside{padding:23px 16px;border-right:1px solid #303a32}.tabs{display:flex;gap:6px;margin-bottom:17px}.tabs button{flex:1;font-size:13px}input{background:#18211c;border:1px solid #3c4940;color:#e3e6df;width:100%;padding:10px;border-radius:6px;outline:none}input:focus{border-color:#a9bf90}.list{margin-top:15px;display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 280px);overflow:auto}.list button{border-color:transparent;background:transparent;text-align:left;padding:11px 10px;display:flex;justify-content:space-between;gap:7px}.list button[aria-pressed=true]{background:#2b382c;color:#e4eedb;border-color:#50624a}.list small{color:#869582;white-space:nowrap;font-size:11px;padding-top:3px}.empty-list{color:#8b9888;padding:12px}main{min-width:0;padding:25px 28px 32px}.topline{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}h2{font-size:24px;margin:0 0 8px;font-weight:530;letter-spacing:-.5px}.meta{color:#8d9e88;font-size:12px;line-height:1.8}.status{font-size:12px;color:#a9ba9f;border:1px solid #42523e;border-radius:20px;padding:7px 10px;white-space:nowrap}.directions{display:flex;flex-wrap:wrap;gap:6px;margin:23px 0 16px}.directions button{font-size:12px;padding:7px 12px}.panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.panels.scenes{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{border:1px solid #354032;border-radius:8px;overflow:hidden;background:#19201b}.panel h3{font-size:13px;font-weight:550;margin:0;padding:14px 15px;border-bottom:1px solid #303a32;display:flex;justify-content:space-between;gap:5px}.panel h3 span{font-size:11px;color:#98a792;font-weight:400}.visual{aspect-ratio:3/2;display:flex;align-items:center;justify-content:center;background:#111714;cursor:zoom-in;border:0;border-radius:0;padding:0;width:100%}.visual img{width:100%;height:100%;object-fit:contain}.visual.empty{cursor:default;font-size:13px;color:#869780;line-height:1.8;text-align:center;padding:35px}.panel footer{min-height:41px;padding:12px 15px;font-size:11px;color:#82907f}.panel footer a{font-size:11px}.note{font-size:12px;color:#97a590;line-height:1.9;margin:20px 0 0;max-width:930px}.nav{display:flex;gap:6px;margin-top:24px}.nav button{font-size:12px;padding:8px 16px}dialog{padding:0;background:#101613;color:#edf3e7;border:1px solid #607655;border-radius:10px;width:min(1500px,96vw);max-height:95vh}dialog::backdrop{background:#000b}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:12px 18px}.dialog-head button{padding:5px 13px}dialog img{display:block;width:100%;max-height:85vh;object-fit:contain;background:#151b18}.image-title{color:#aab9a1;font-size:13px}
@media(max-width:1050px){header{padding:22px}.shell{grid-template-columns:205px 1fr}main{padding:23px 20px}.panels{grid-template-columns:1fr}.visual{max-height:490px}.list{max-height:calc(100vh - 280px)}.counter{display:none}}
@media(max-width:650px){header{padding:18px}.shell{display:block}aside{border-right:0;border-bottom:1px solid #303a32;padding:14px 18px}.list{max-height:150px}.tabs{margin-bottom:10px}main{padding:20px 18px}.panels.scenes{grid-template-columns:1fr}.topline{display:block}.status{display:inline-block;margin-top:10px}h1{font-size:21px}}
</style>
<header><div><h1>어둠의 오브젝트 · 아트 비교</h1><p>생성한 컨셉과 실제 게임 모델, 변경 전후 장면을 같은 방향에서 살펴봅니다.</p></div><div class="counter" id="counts"></div></header>
<div class="shell"><aside><div class="tabs"><button id="objectsTab" aria-pressed="true">오브젝트</button><button id="scenesTab" aria-pressed="false">실제 장소</button></div><input id="search" type="search" placeholder="이름으로 찾기" aria-label="오브젝트와 장소 검색"><nav class="list" id="list" aria-label="비교 항목"></nav></aside><main><div class="topline"><div><h2 id="title"></h2><div class="meta" id="meta"></div></div><div class="status" id="status"></div></div><div class="directions" id="directions" aria-label="촬영 방향"></div><div class="panels" id="panels"></div><p class="note" id="note"></p><div class="nav"><button id="previous">← 이전 항목</button><button id="next">다음 항목 →</button></div></main></div>
<dialog id="lightbox"><div class="dialog-head"><span class="image-title" id="imageTitle"></span><button id="close" aria-label="확대 보기 닫기">닫기 · Esc</button></div><img id="largeImage" alt=""></dialog>
<script id="data" type="application/json">__REVIEW_DATA__</script>
<script>
const data=JSON.parse(document.querySelector('#data').textContent),$=s=>document.querySelector(s);
let mode='objects',active=data.objects[0]?.id,view='sheet';
const labels={sheet:'6방향 전체',front:'정면',back:'후면',left:'왼쪽',right:'오른쪽',top:'위',bottom:'아래'};
const categories={character:'캐릭터',equipment:'장비',prop:'소품',hideout_prop:'은신처 소품',architecture:'건축물',effect:'시각 효과',mine_prop:'폐광 소품',mine_geometry:'폐광 지형',camp:'야영 도구',environment:'환경',vfx:'시각 효과',test_fixture:'시험 도구'};
$('#counts').innerHTML=`전체 <strong>${data.counts.total}</strong>종 · 컨셉 <strong>${data.counts.concept}</strong>종<br>변경 전 <strong>${data.counts.baseline}</strong>종 · 현재 촬영 <strong>${data.counts.current}</strong>종`;
function filtered(){const q=$('#search').value.trim().toLocaleLowerCase();return data[mode].filter(x=>(x.title+' '+x.id).toLocaleLowerCase().includes(q));}
function renderList(){const list=$('#list');list.replaceChildren();for(const entry of filtered()){const button=document.createElement('button');button.setAttribute('aria-pressed',String(entry.id===active));const label=document.createElement('span');label.textContent=entry.title;button.append(label);if(mode==='objects'){const small=document.createElement('small');small.textContent=entry.current?'촬영됨':'촬영 대기';button.append(small);}button.onclick=()=>{active=entry.id;render();};list.append(button);}if(!list.children.length){const empty=document.createElement('span');empty.className='empty-list';empty.textContent='일치하는 항목이 없습니다.';list.append(empty);}}
function panel(title,subtitle,url,record,missing){const wrap=document.createElement('section');wrap.className='panel';const heading=document.createElement('h3');heading.append(document.createTextNode(title));const sub=document.createElement('span');sub.textContent=subtitle;heading.append(sub);wrap.append(heading);const visual=document.createElement(url?'button':'div');visual.className='visual'+(url?'':' empty');if(url){visual.setAttribute('aria-label',title+' 확대');const img=document.createElement('img');img.src=url;img.alt=$('#title').textContent+' · '+title;visual.append(img);visual.onclick=()=>{$('#largeImage').src=url;$('#largeImage').alt=img.alt;$('#imageTitle').textContent=img.alt;$('#lightbox').showModal();};}else visual.textContent=missing;wrap.append(visual);const footer=document.createElement('footer');if(record){const a=document.createElement('a');a.href=record.manifest;a.textContent='촬영 기록';a.target='_blank';footer.append(a,document.createTextNode(' · '+record.iteration));}else footer.textContent=url?'이미지 생성 원본':'대체 이미지를 넣지 않았습니다.';wrap.append(footer);return wrap;}
function render(){renderList();const entry=data[mode].find(x=>x.id===active);if(!entry)return;$('#title').textContent=entry.title;$('#meta').textContent=mode==='objects'?`${categories[entry.category]||entry.category} · ${entry.id}`:'같은 위치 · 같은 시야각 · 실제 장소의 조명';$('#status').textContent=mode==='objects'?(entry.current?'현재 모델 촬영 완료':'현재 모델 촬영 대기'):(entry.current?'변경 전후 촬영 완료':'현재 장소 촬영 대기');$('#directions').replaceChildren();if(mode==='objects')for(const [key,label] of Object.entries(labels)){const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed',String(view===key));b.onclick=()=>{view=key;render();};$('#directions').append(b);}const panels=$('#panels');panels.className='panels'+(mode==='scenes'?' scenes':'');panels.replaceChildren();if(mode==='objects')panels.append(panel('생성 컨셉','6방향 원본',entry.concept,null,'컨셉 생성 대기'));for(const [key,title] of [['baseline','변경 전 모델'],['current','현재 모델']]){const r=entry[key],url=r?(mode==='scenes'||view==='sheet'?r.sheet:r.views[view]):null;panels.append(panel(mode==='scenes'?title.replace('모델','장소'):title,mode==='scenes'?'실제 게임 렌더':labels[view],url,r,'실제 촬영 대기'));}$('#note').textContent=mode==='objects'?'실제 모델 비교판 순서: 첫 줄 정면 · 후면 · 왼쪽, 둘째 줄 오른쪽 · 위 · 아래. 정면은 게임의 −Z 축입니다. 컨셉은 생성 원본을 그대로 표시하며, 모델은 동일한 도감 조명으로 촬영했습니다. 완성된 플레이어 몸·손·팔은 요청에 따라 제외했습니다. 촬영 완료는 형태의 일치 판정과 별개입니다.':'은신처·성물실·폐광의 실제 공간과 소품을 촬영했습니다. 몸과 손은 숨기고 실제 횃불의 전방 조명·주변 보조광을 유지했습니다. 원정 상태와 커서를 보존했으며 별도 게임 창이나 외부 입력 없이 촬영했습니다.';}
function selectMode(nextMode){mode=nextMode;active=data[mode][0]?.id;$('#search').value='';$('#objectsTab').setAttribute('aria-pressed',String(mode==='objects'));$('#scenesTab').setAttribute('aria-pressed',String(mode==='scenes'));render();}
$('#objectsTab').onclick=()=>selectMode('objects');$('#scenesTab').onclick=()=>selectMode('scenes');$('#search').oninput=renderList;for(const [id,delta]of[['previous',-1],['next',1]])$('#'+id).onclick=()=>{const items=filtered();if(!items.length)return;const index=items.findIndex(x=>x.id===active);active=items[index<0?(delta<0?items.length-1:0):(index+delta+items.length)%items.length].id;render();};$('#close').onclick=()=>$('#lightbox').close();$('#lightbox').onclick=e=>{if(e.target===$('#lightbox'))$('#lightbox').close();};render();
</script>
</html>
