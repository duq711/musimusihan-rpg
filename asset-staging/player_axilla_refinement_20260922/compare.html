<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>겨드랑이 연결 · 수정 전후</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #141b1b; color: #eef1ea; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1440px, 100%); margin: auto; padding: 28px clamp(16px, 3vw, 40px) 32px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    h1 { font-size: clamp(21px, 3vw, 30px); letter-spacing: -.04em; margin: 0 0 8px; }
    p { margin: 0; color: #b4bdb6; font-size: 14px; line-height: 1.6; }
    a { color: #d6e8ba; text-decoration: none; }
    .viewer-link { flex-shrink: 0; padding: 10px 14px; border: 1px solid #455442; border-radius: 10px; font-size: 14px; }
    .viewer-link:hover { background: #29352a; }
    .controls { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px 24px; margin-bottom: 18px; }
    .control-group { display: flex; align-items: center; gap: 10px; }
    .group-label { font-size: 13px; color: #b4bdb6; }
    .buttons { display: flex; gap: 5px; padding: 4px; border: 1px solid #34403c; border-radius: 12px; background: #1b2421; }
    button { font: inherit; font-size: 14px; border: 0; border-radius: 8px; background: transparent; color: #bec8c0; padding: 9px 16px; cursor: pointer; }
    button:hover { color: #fff; background: #2b3630; }
    button[aria-pressed="true"] { color: #18211a; background: #c8dbaa; }
    :focus-visible { outline: 2px solid #e0edca; outline-offset: 4px; }
    .comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    figure { min-width: 0; margin: 0; border: 1px solid #34403c; border-radius: 14px; overflow: hidden; background: #1c2322; }
    figcaption { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px 18px; border-bottom: 1px solid #34403c; }
    figcaption strong { font-size: 15px; font-weight: 650; }
    figcaption span { font-size: 12px; color: #aeb9b2; }
    .after figcaption strong { color: #d6e8ba; }
    .image-wrap { position: relative; aspect-ratio: 1; }
    img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .error { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; background: #1c2322; color: #b4bdb6; font-size: 14px; }
    .error[hidden] { display: none; }
    footer { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
    footer p { font-size: 12px; }
    @media (max-width: 680px) {
      main { padding-top: 20px; }
      header { align-items: flex-start; flex-direction: column; gap: 14px; margin-bottom: 20px; }
      .comparison { grid-template-columns: 1fr; gap: 18px; }
      .controls { align-items: flex-start; }
      .group-label { min-width: 26px; }
      button { padding: 9px 13px; }
      figcaption { padding: 12px 15px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>가슴과 팔의 연결 · 수정 전후</h1>
        <p>겨드랑이와 어깨로 이어지는 곡면을 비교해보세요.</p>
      </div>
      <a class="viewer-link" href="/?view=axilla">360°로 살펴보기 ↗</a>
    </header>
    <div class="controls">
      <div class="control-group">
        <span class="group-label" id="angle-label">각도</span>
        <div class="buttons" role="group" aria-labelledby="angle-label">
          <button type="button" data-angle="front" aria-pressed="true">정면</button>
          <button type="button" data-angle="oblique" aria-pressed="false">사선</button>
          <button type="button" data-angle="rear" aria-pressed="false">후면</button>
        </div>
      </div>
      <div class="control-group">
        <span class="group-label" id="material-label">보기</span>
        <div class="buttons" role="group" aria-labelledby="material-label">
          <button type="button" data-material="textured" aria-pressed="true">실제 재질</button>
          <button type="button" data-material="clay" aria-pressed="false">형태 확인</button>
        </div>
      </div>
    </div>
    <section class="comparison" aria-label="같은 시점의 수정 전후 비교">
      <figure>
        <figcaption><strong>수정 전</strong><span class="view-label">정면 · 실제 재질</span></figcaption>
        <div class="image-wrap">
          <img id="before" src="/axilla/before/axilla_front.png" alt="수정 전 가슴과 팔의 연결, 정면, 실제 재질" decoding="async">
          <div class="error" hidden>이미지를 불러오지 못했습니다. 잠시 후 새로고침해주세요.</div>
        </div>
      </figure>
      <figure class="after">
        <figcaption><strong>수정 후</strong><span class="view-label">정면 · 실제 재질</span></figcaption>
        <div class="image-wrap">
          <img id="after" src="/axilla/after/axilla_front.png" alt="수정 후 가슴과 팔의 연결, 정면, 실제 재질" decoding="async">
          <div class="error" hidden>이미지를 불러오지 못했습니다. 잠시 후 새로고침해주세요.</div>
        </div>
      </figure>
    </section>
    <footer>
      <p>수정 전후 모두 같은 카메라 위치와 조명을 사용했습니다.</p>
      <p id="selection" role="status" aria-live="polite">정면 · 실제 재질</p>
    </footer>
  </main>
  <script>
    (() => {
      const angles = { front: '정면', oblique: '사선', rear: '후면' };
      const materials = { textured: '실제 재질', clay: '형태 확인' };
      const state = { angle: 'front', material: 'textured' };
      const images = [document.getElementById('before'), document.getElementById('after')];
      for (const img of images) {
        const error = img.nextElementSibling;
        img.addEventListener('load', () => { error.hidden = true; });
        img.addEventListener('error', () => { error.hidden = false; });
        if (img.complete && !img.naturalWidth) error.hidden = false;
      }
      function update() {
        const label = `${angles[state.angle]} · ${materials[state.material]}`;
        const file = `axilla_${state.angle}${state.material === 'clay' ? '_clay' : ''}.png`;
        for (const img of images) {
          img.nextElementSibling.hidden = true;
          img.alt = `${img.id === 'before' ? '수정 전' : '수정 후'} 가슴과 팔의 연결, ${label}`;
          img.src = `/axilla/${img.id}/${file}`;
        }
        document.querySelectorAll('.view-label').forEach(el => { el.textContent = label; });
        document.getElementById('selection').textContent = label;
        document.querySelectorAll('[data-angle]').forEach(el => { el.setAttribute('aria-pressed', String(el.dataset.angle === state.angle)); });
        document.querySelectorAll('[data-material]').forEach(el => { el.setAttribute('aria-pressed', String(el.dataset.material === state.material)); });
      }
      document.querySelectorAll('[data-angle]').forEach(el => {
        el.addEventListener('click', () => { state.angle = el.dataset.angle; update(); });
      });
      document.querySelectorAll('[data-material]').forEach(el => {
        el.addEventListener('click', () => { state.material = el.dataset.material; update(); });
      });
    })();
  </script>
</body>
</html>
